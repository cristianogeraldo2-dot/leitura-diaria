<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2c2a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Dia">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Guia do Meu Dia</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Segoe UI', Roboto, sans-serif; background:#1f1e1b; color:#f7f4ef; min-height:100vh; }
  .app { max-width:480px; margin:0 auto; padding:16px 14px 90px; }
  .topo { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .topo .marca { font-size:10px; letter-spacing:3px; color:#c9bfa8; font-weight:600; }
  .topo h1 { font-size:19px; font-weight:700; }
  .prog { background:#2c2a26; border:1px solid #4a463d; border-radius:12px; padding:8px 12px; font-size:12px; font-weight:700; color:#e8c96a; }
  .card { background:#2a2925; border:1px solid #4a463d; border-radius:14px; padding:14px; margin-bottom:12px; }
  .rotulo { font-size:10px; letter-spacing:2.5px; color:#c9bfa8; font-weight:600; margin-bottom:6px; display:flex; justify-content:space-between; }
  .verso { font-size:15px; font-style:italic; line-height:1.5; }
  .ref { font-size:11px; color:#c9bfa8; font-weight:600; margin-top:6px; }
  .livro { font-size:14px; font-weight:600; line-height:1.45; }
  .tarefa { display:flex; align-items:center; gap:10px; background:#2a2925; border:1px solid #4a463d; border-radius:12px; padding:10px 12px; margin-bottom:7px; }
  .tarefa.ativa { background:#e8c96a; color:#2c2a26; border-color:#e8c96a; }
  .tarefa.ativa .dur { color:#6b5f35 !important; }
  .hora { font-size:13px; font-weight:700; min-width:42px; }
  .info { flex:1; min-width:0; }
  .titulo { font-size:14px; font-weight:600; }
  .dur { font-size:11px; color:#c9bfa8; }
  .chk { width:44px; height:44px; border-radius:50%; border:2px solid #c9bfa8; background:transparent; color:#1f1e1b; font-size:18px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0; }
  .tarefa.ativa .chk { border-color:#2c2a26; }
  .chk.feito { background:#5a7d4f; border-color:#5a7d4f; color:#fff; }
  .chk:active { transform:scale(.9); }
  :focus-visible { outline:2px solid #e8c96a; outline-offset:2px; }
  .exame textarea { width:100%; background:#1f1e1b; border:1px solid #4a463d; border-radius:10px; color:#f7f4ef; padding:9px; font-size:13px; font-family:inherit; resize:vertical; min-height:52px; margin-top:6px; }
  .exame textarea:focus { outline:none; border-color:#e8c96a; }
  .pergunta { font-size:13px; font-weight:600; color:#e8c96a; margin-top:10px; display:block; }
  .botoes { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  button.acao { background:#e8c96a; color:#2c2a26; border:none; border-radius:10px; padding:12px 14px; font-size:13px; font-weight:700; cursor:pointer; }
  button.sec { background:transparent; color:#c9bfa8; border:1px solid #4a463d; border-radius:10px; padding:12px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  .status { font-size:12px; color:#c9bfa8; margin-top:8px; width:100%; }
  .banner { position:fixed; left:50%; transform:translateX(-50%); bottom:18px; background:#e8c96a; color:#2c2a26; padding:12px 14px 12px 20px; border-radius:12px; font-size:14px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.5); display:none; max-width:92%; align-items:center; gap:12px; }
  .banner button { background:transparent; border:none; color:#2c2a26; font-size:18px; font-weight:700; cursor:pointer; padding:4px 8px; }
  .edit label, .campo label { display:block; font-size:11px; color:#c9bfa8; margin-top:6px; }
  .edit input, .campo input { background:#1f1e1b; border:1px solid #4a463d; border-radius:6px; color:#f7f4ef; font-size:14px; padding:6px 8px; width:100%; margin-top:3px; }
  .del { background:transparent; border:none; color:#d4786a; font-size:20px; cursor:pointer; width:44px; height:44px; flex-shrink:0; }
  .vazio { color:#c9bfa8; font-size:13px; padding:10px 2px; }
  #formAdd { display:none; }
  .plano select { background:#1f1e1b; border:1px solid #4a463d; border-radius:8px; color:#f7f4ef; font-size:13px; padding:6px 8px; max-width:55%; }
  .plano .prox { font-size:16px; font-weight:700; margin:8px 0 6px; }
  .barra { height:8px; background:#1f1e1b; border-radius:6px; overflow:hidden; }
  .barra > div { height:100%; background:#5a7d4f; width:0; transition:width .3s; }
  .plano .meta { font-size:11px; color:#c9bfa8; margin-top:6px; }
</style>
</head>
<body>
<div class="app">
  <div class="topo">
    <div>
      <div class="marca">GUIA DO MEU DIA</div>
      <h1 id="dataHoje"></h1>
    </div>
    <div class="prog" id="progresso" aria-live="polite">0% feito</div>
  </div>

  <div class="card">
    <div class="rotulo"><span>PALAVRA DO DIA</span><span id="diaAno"></span></div>
    <div class="verso" id="verso"></div>
    <div class="ref" id="versoRef"></div>
  </div>

  <div class="card">
    <div class="rotulo">LIVRO DO DIA</div>
    <div class="livro" id="livro"></div>
  </div>

  <div class="card plano">
    <div class="rotulo"><span>LEITURA DA BÍBLIA</span>
      <select id="planoSel" aria-label="Plano de leitura"></select></div>
    <div class="prox" id="planoProx"></div>
    <div class="barra"><div id="planoBarra"></div></div>
    <div class="meta" id="planoMeta"></div>
    <div class="botoes"><button class="acao" id="btnLido">✓ Li hoje</button>
      <button class="sec" id="btnPlanoZera">Reiniciar plano</button></div>
  </div>

  <div class="rotulo" style="margin:4px 0 8px;">CRONOGRAMA</div>
  <div id="lista"></div>

  <div id="formAdd" class="card campo">
    <div class="rotulo">NOVO BLOCO</div>
    <label for="nHora">Hora</label>
    <input id="nHora" type="time" value="07:00">
    <label for="nTitulo">Título</label>
    <input id="nTitulo" type="text" placeholder="ex: Estudo" maxlength="80">
    <label for="nDur">Duração</label>
    <input id="nDur" type="text" placeholder="ex: 2h" maxlength="20">
    <div class="botoes"><button class="acao" id="btnAdd">Adicionar</button></div>
  </div>

  <div class="card exame">
    <div class="rotulo">EXAME DA NOITE</div>
    <label class="pergunta" for="e1">1. Onde vi Deus agindo no meu dia hoje?</label>
    <textarea id="e1"></textarea>
    <label class="pergunta" for="e2">2. O que fiz bem em trabalho, estudo e família?</label>
    <textarea id="e2"></textarea>
    <label class="pergunta" for="e3">3. O que preciso ajustar com propósito amanhã?</label>
    <textarea id="e3"></textarea>
  </div>

  <div class="botoes">
    <button class="acao" id="btnNotif">🔔 Ativar alertas do dia</button>
    <button class="sec" id="btnBloco">+ Bloco</button>
    <button class="sec" id="btnEditar">✏️ Editar</button>
    <button class="sec" id="btnNovoDia">↺ Novo dia</button>
    <button class="sec" id="btnExportar">⬇ Exportar</button>
    <button class="sec" id="btnImportar">⬆ Importar</button>
    <input type="file" id="arqImportar" accept="application/json" hidden>
    <div class="status" id="statusNotif"></div>
  </div>
</div>
<div class="banner" id="banner" role="status"><span id="bannerTxt"></span><button id="bannerFecha" aria-label="Fechar aviso">✕</button></div>

<script>
const VERSOS = [
 ["Tudo tem o seu tempo determinado, e há tempo para todo propósito debaixo do céu.","Eclesiastes 3:1"],
 ["Lâmpada para os meus pés é a tua palavra e luz para o meu caminho.","Salmos 119:105"],
 ["Posso todas as coisas naquele que me fortalece.","Filipenses 4:13"],
 ["Entrega o teu caminho ao Senhor; confia nele, e ele tudo fará.","Salmos 37:5"],
 ["O amor é paciente, é benigno; o amor não arde em ciúmes, não se ufana, não se ensoberbece.","1 Coríntios 13:4"],
 ["Bem-aventurado o homem que não anda segundo o conselho dos ímpios.","Salmos 1:1"],
 ["O temor do Senhor é o princípio da sabedoria.","Provérbios 9:10"],
 ["Não temas, porque eu sou contigo; não te assombres, porque eu sou o teu Deus.","Isaías 41:10"],
 ["Vigiai e orai, para que não entreis em tentação.","Mateus 26:41"],
 ["Melhor é o fim das coisas do que o seu princípio; melhor é o paciente do que o altivo de espírito.","Eclesiastes 7:8"],
 ["O coração do homem traça o seu caminho, mas o Senhor lhe dirige os passos.","Provérbios 16:9"],
 ["Não te deixes vencer do mal, mas vence o mal com o bem.","Romanos 12:21"],
 ["O Senhor é a minha porção, diz a minha alma; portanto, esperarei nele.","Lamentações 3:24"],
 ["Sê forte e corajoso; não temas, nem te espantes, porque o Senhor, teu Deus, é contigo por onde quer que andares.","Josué 1:9"],
 ["Agora, pois, permanecem a fé, a esperança e o amor, estes três; porém o maior destes é o amor.","1 Coríntios 13:13"],
 ["E tudo o que fizerdes, fazei-o de todo o coração, como ao Senhor e não aos homens.","Colossenses 3:23"],
 ["Confia no Senhor de todo o teu coração e não te estribes no teu próprio entendimento.","Provérbios 3:5"],
 ["Dai a César o que é de César e a Deus o que é de Deus.","Mateus 22:21"],
 ["Inútil vos será levantar de madrugada, repousar tarde, comer o pão de dores, pois aos seus amados ele o dá enquanto dormem.","Salmos 127:2"],
 ["O Senhor te guiará continuamente, fartará a tua alma em lugares áridos.","Isaías 58:11"],
 ["O temor do Senhor é o princípio do conhecimento, mas os loucos desprezam a sabedoria e a instrução.","Provérbios 1:7"],
 ["Melhor é um punhado com descanso do que ambas as mãos cheias com trabalho e correr atrás do vento.","Eclesiastes 4:6"],
 ["O trabalho do justo conduz à vida; o rendimento do perverso, ao pecado.","Provérbios 10:16"],
 ["Bem-aventurado o homem que acha sabedoria, e o homem que adquire conhecimento.","Provérbios 3:13"],
 ["Porque eu bem sei os pensamentos que tenho a vosso respeito, diz o Senhor; pensamentos de paz e não de mal.","Jeremias 29:11"],
 ["Mas vós, esforçai-vos, e não desfaleçam as vossas mãos, porque a vossa obra será recompensada.","2 Crônicas 15:7"],
 ["A mão dos diligentes dominará, mas a negligência será tributária.","Provérbios 12:24"],
 ["Certamente que a bondade e a misericórdia me seguirão todos os dias da minha vida.","Salmos 23:6"],
 ["Os planos do diligente tendem à abundância.","Provérbios 21:5"],
 ["Pois melhor é um dia nos teus átrios do que mil fora deles.","Salmos 84:10"],
 ["E a paz de Deus, que excede todo o entendimento, guardará o vosso coração e os vossos pensamentos em Cristo Jesus.","Filipenses 4:7"],
 ["Quanto ao mais, irmãos, tudo o que é verdadeiro, tudo o que é respeitável, tudo o que é justo, nisso pensai.","Filipenses 4:8"],
 ["O ladrão vem somente para roubar, matar e destruir; eu vim para que tenham vida, e a tenham em abundância.","João 10:10"],
 ["Atentai, pois, diligentemente para como andais, não como insensatos, e sim como sábios.","Efésios 5:15"],
 ["Acima de tudo, porém, tende amor intenso uns para com os outros, porque o amor cobre multidão de pecados.","1 Pedro 4:8"],
 ["Ora, a fé é a certeza de coisas que se esperam, a convicção de fatos que se não veem.","Hebreus 11:1"],
];
const LIVROS = [
 "Os 7 Hábitos das Pessoas Altamente Eficazes — Stephen Covey",
 "Pai Rico, Pai Pobre — Robert Kiyosaki",
 "O Homem Mais Rico da Babilônia — George S. Clason",
 "A Bíblia de Vendas — Jeffrey Gitomer",
 "Desenvolvendo o Líder que Está em Você — John Maxwell",
 "Inteligência Emocional — Daniel Goleman",
 "O Poder do Hábito — Charles Duhigg",
 "Quem Mexeu no Meu Queijo? — Spencer Johnson",
 "Trabalho Focado (Deep Work) — Cal Newport",
 "Essencialismo — Greg McKeown",
 "Mindset — Carol Dweck",
 "Como Fazer Amigos e Influenciar Pessoas — Dale Carnegie",
 "A Cabana — William P. Young",
 "O Peregrino — John Bunyan",
 "Cristianismo Puro e Simples — C.S. Lewis",
 "Milagres — C.S. Lewis",
 "Crazy Love — Francis Chan",
 "O Desafio do Amor — Stephen e Alex Kendrick",
 "Coração Selvagem — John Eldredge",
 "O Homem ao Máximo — Ed Cole",
 "Provérbios — leitura de 1 capítulo por dia",
 "A Arte de Fazer Acontecer — David Allen",
 "Primeiro, Deus — Mark Batterson",
];
const PADRAO = [
 {hora:"06:00", titulo:"Despertar & Oração", dur:"30 min", intencao:"Entrego meu dia a Deus"},
 {hora:"06:30", titulo:"Leitura da Bíblia", dur:"30 min", intencao:"Alimento para a alma"},
 {hora:"07:00", titulo:"Exercício", dur:"45 min", intencao:"Cuido do templo de Deus"},
 {hora:"08:00", titulo:"Trabalho", dur:"4h", intencao:"Provisão com excelência"},
 {hora:"12:00", titulo:"Almoço & Família", dur:"1h", intencao:"Presença, não presente"},
 {hora:"13:00", titulo:"Trabalho", dur:"3h", intencao:"Servir com propósito"},
 {hora:"16:00", titulo:"Estudo", dur:"2h", intencao:"Crescer em conhecimento"},
 {hora:"18:00", titulo:"Família", dur:"2h", intencao:"Amar quem me é próximo"},
 {hora:"20:00", titulo:"Leitura", dur:"1h", intencao:"Mente renovada"},
 {hora:"21:30", titulo:"Reflexão do Dia", dur:"30 min", intencao:"Exame da noite"},
];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
const PLANOS = {
  proverbios:{nome:"Provérbios", livro:"Provérbios", caps:31},
  joao:{nome:"Evangelho de João", livro:"João", caps:21},
  mateus:{nome:"Evangelho de Mateus", livro:"Mateus", caps:28},
  salmos:{nome:"Salmos", livro:"Salmos", caps:150},
  atos:{nome:"Atos dos Apóstolos", livro:"Atos", caps:28},
};
const JANELA_ALERTA = 5; // minutos: avisa atrasado se o timer foi adiado
const $ = id => document.getElementById(id);

// ---------- armazenamento seguro ----------
function lerJSON(k, padrao){
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch(e){ return padrao; }
}
function gravar(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){}
}

// ---------- estado ----------
let chave, feitos, notificados;
let editMode = false;
let tarefas = (lerJSON("gd_tarefas_v1", null) || PADRAO.map((t,i)=>({...t,id:"p"+i})))
  .map(t=>({...t, id:String(t.id)}));

function dataLocal(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function novoId(){ return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function salva(){ gravar("gd_tarefas_v1", tarefas); gravar("gd_feitos_"+chave, feitos); }

function carregaDia(){
  const hoje = new Date();
  chave = dataLocal(hoje);
  feitos = lerJSON("gd_feitos_"+chave, {});
  notificados = lerJSON("gd_notif_"+chave, {});
  const ex = lerJSON("gd_exame_"+chave, {});
  $("e1").value = ex.e1||""; $("e2").value = ex.e2||""; $("e3").value = ex.e3||"";
  const diaAno = Math.floor((new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate()) - new Date(hoje.getFullYear(),0,0)) / 864e5);
  $("dataHoje").textContent = DIAS[hoje.getDay()]+", "+hoje.getDate()+" de "+MESES[hoje.getMonth()];
  $("diaAno").textContent = "Dia "+diaAno+" do ano";
  const v = VERSOS[diaAno % VERSOS.length];
  $("verso").textContent = "“"+v[0]+"”"; $("versoRef").textContent = v[1];
  $("livro").textContent = "📖 "+LIVROS[diaAno % LIVROS.length];
  if (typeof renderPlano==="function" && typeof plano!=="undefined") renderPlano();
}
function salvaExame(){ gravar("gd_exame_"+chave, {e1:$("e1").value, e2:$("e2").value, e3:$("e3").value}); }

function paraMin(h){ const [a,b]=(h||"00:00").split(":"); return parseInt(a)*60+parseInt(b); }
function agoraMin(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }

// ---------- DOM seguro ----------
function el(tag, props, ...filhos){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (k==="class") e.className = v;
    else if (k==="text") e.textContent = v;
    else if (k.startsWith("on")) e[k] = v;
    else e.setAttribute(k, v);
  }
  filhos.forEach(f=>f && e.appendChild(f));
  return e;
}
function campoEdicao(rotulo, tipo, valor, max, aoMudar){
  const id = "ed"+Math.random().toString(36).slice(2,8);
  const i = el("input", {id, type:tipo, maxlength:max});
  i.value = valor;
  i.onchange = () => aoMudar(i.value);
  return [el("label", {for:id, text:rotulo}), i];
}

function render(){
  const agora = agoraMin();
  tarefas.sort((a,b)=>paraMin(a.hora)-paraMin(b.hora));
  let prox = null;
  tarefas.forEach(t=>{ if(!feitos[t.id] && paraMin(t.hora)>=agora && (prox===null||paraMin(t.hora)<prox)) prox=paraMin(t.hora); });
  const lista = $("lista");
  lista.replaceChildren();
  if (!tarefas.length) lista.appendChild(el("div", {class:"vazio", text:"Nenhum bloco. Use “+ Bloco” para adicionar."}));
  tarefas.forEach(t=>{
    const ativa = !feitos[t.id] && paraMin(t.hora)===prox;
    const row = el("div", {class:"tarefa"+(ativa?" ativa":"")});
    if (editMode){
      const info = el("div", {class:"info edit"});
      [
        campoEdicao("Hora","time",t.hora,5,v=>{ if(v){t.hora=v; salva(); render();} }),
        campoEdicao("Título","text",t.titulo,80,v=>{ t.titulo=v.trim()||t.titulo; salva(); render(); }),
        campoEdicao("Duração","text",t.dur,20,v=>{ t.dur=v.trim(); salva(); render(); }),
        campoEdicao("Intenção","text",t.intencao||"",120,v=>{ t.intencao=v.trim(); salva(); render(); }),
      ].forEach(par=>par.forEach(n=>info.appendChild(n)));
      row.appendChild(info);
      row.appendChild(el("button", {class:"del", type:"button", "aria-label":"Excluir bloco "+t.titulo, text:"✕",
        onclick:()=>{ if(!confirm("Excluir “"+t.titulo+"”?")) return;
          tarefas=tarefas.filter(x=>x.id!==t.id); delete feitos[t.id]; salva(); render(); }}));
    } else {
      const feito = !!feitos[t.id];
      row.appendChild(el("div", {class:"hora", text:t.hora}));
      row.appendChild(el("div", {class:"info"},
        el("div", {class:"titulo", text:t.titulo}),
        el("div", {class:"dur", text:t.dur+(t.intencao?" · “"+t.intencao+"”":"")})));
      row.appendChild(el("button", {class:"chk"+(feito?" feito":""), type:"button",
        "aria-pressed":String(feito), "aria-label":(feito?"Desmarcar ":"Concluir ")+t.titulo, text:feito?"✓":"",
        onclick:()=>{ feitos[t.id]=!feitos[t.id]; salva(); render(); }}));
    }
    lista.appendChild(row);
  });
  const total = tarefas.length;
  const done = tarefas.filter(t=>feitos[t.id]).length;
  $("progresso").textContent = (total ? Math.round(done/total*100) : 0)+"% feito";
}

// ---------- plano de leitura ----------
let plano = lerJSON("gd_plano_v1", null) || {};
plano = {plano: PLANOS[plano.plano] ? plano.plano : "proverbios", prog: plano.prog||{}, feitoEm: plano.feitoEm||{}};
function salvaPlano(){ gravar("gd_plano_v1", plano); }
function renderPlano(){
  const sel = $("planoSel");
  if (!sel.options.length) Object.entries(PLANOS).forEach(([k,v])=>sel.appendChild(el("option",{value:k,text:v.nome})));
  sel.value = plano.plano;
  const pl = PLANOS[plano.plano], n = plano.prog[plano.plano]||0, jaHoje = plano.feitoEm[plano.plano]===chave;
  const concluido = n >= pl.caps;
  $("planoProx").textContent = concluido ? "Plano concluído 🎉" : (jaHoje ? "Hoje: " : "Próximo: ")+pl.livro+" "+(jaHoje ? n : n+1);
  $("planoBarra").style.width = Math.round(n/pl.caps*100)+"%";
  $("planoMeta").textContent = n+" de "+pl.caps+" capítulos lidos";
  const b = $("btnLido");
  b.textContent = jaHoje ? "↩ Desfazer leitura de hoje" : "✓ Li hoje";
  b.disabled = concluido && !jaHoje;
  b.style.opacity = b.disabled ? .5 : 1;
}
function marcaLido(){
  const k = plano.plano, pl = PLANOS[k], n = plano.prog[k]||0;
  if (plano.feitoEm[k]===chave){ plano.prog[k] = Math.max(0,n-1); delete plano.feitoEm[k]; }
  else if (n < pl.caps){ plano.prog[k] = n+1; plano.feitoEm[k] = chave; mostra("Leitura registrada: "+pl.livro+" "+(n+1)+" 🙏"); }
  salvaPlano(); renderPlano();
}
$("planoSel").onchange = e => { plano.plano = e.target.value; salvaPlano(); renderPlano(); };
$("btnLido").onclick = marcaLido;
$("btnPlanoZera").onclick = () => { if(!confirm("Reiniciar o plano “"+PLANOS[plano.plano].nome+"” do início?")) return;
  plano.prog[plano.plano]=0; delete plano.feitoEm[plano.plano]; salvaPlano(); renderPlano(); };

// ---------- avisos ----------
let tBanner;
function mostra(msg){
  $("bannerTxt").textContent = msg;
  $("banner").style.display = "flex";
  clearTimeout(tBanner);
  tBanner = setTimeout(()=>$("banner").style.display="none", 8000);
}
$("bannerFecha").onclick = () => $("banner").style.display="none";

function atualizaStatusNotif(){
  const s = $("statusNotif");
  if (!("Notification" in window)) { s.textContent = "Este navegador não suporta notificações; só o aviso na tela será usado."; return; }
  s.textContent = {
    granted:"Alertas ativos. Para avisar com o app fechado, instale-o na tela inicial.",
    denied:"Notificações bloqueadas no navegador. Libere nas configurações do site.",
    default:"Alertas ainda não ativados."
  }[Notification.permission];
}
async function ativarNotif(){
  if ("Notification" in window) { try { await Notification.requestPermission(); } catch(e){} }
  atualizaStatusNotif();
  if (!("Notification" in window) || Notification.permission==="granted") mostra("Alertas ativados! Os avisos aparecem nos horários dos blocos.");
  else mostra("Permissão não concedida: usarei apenas o aviso na tela.");
}
async function notificar(titulo, corpo){
  if (!("Notification" in window) || Notification.permission!=="granted") return;
  try {
    const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg) await reg.showNotification(titulo, {body:corpo, icon:"icon-192.png", tag:corpo});
    else new Notification(titulo, {body:corpo, icon:"icon-192.png"});
  } catch(e){}
}

function verificaAlertas(){
  if (dataLocal(new Date()) !== chave){ carregaDia(); render(); return; } // virou o dia
  const agora = agoraMin();
  let mudou = false;
  tarefas.forEach(t=>{
    const delta = agora - paraMin(t.hora);
    if (delta>=0 && delta<=JANELA_ALERTA && !feitos[t.id] && !notificados[t.id]){
      notificados[t.id] = true; mudou = true;
      const msg = "⏰ "+t.hora+" — "+t.titulo+(t.dur?" ("+t.dur+")":"");
      mostra(msg); notificar("Guia do Meu Dia", msg);
    }
  });
  if (mudou) gravar("gd_notif_"+chave, notificados);
  if (!editMode) render(); // não apaga o que está sendo digitado
}

// ---------- ações ----------
function addBloco(){
  const ti = $("nTitulo").value.trim();
  if (!ti || !$("nHora").value) return;
  tarefas.push({id:novoId(), hora:$("nHora").value, titulo:ti, dur:$("nDur").value.trim(), intencao:""});
  $("nTitulo").value=""; $("nDur").value=""; salva(); render();
}
function zerarDia(){
  if (!confirm("Zerar o dia e começar novo?")) return;
  feitos={}; notificados={};
  gravar("gd_notif_"+chave, notificados); salva(); render();
  mostra("Novo dia iniciado! Deus te abençoe. 🙏");
}
function exportar(){
  const dados = {versao:1, tarefas, plano, dias:{}};
  try {
    for (let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if (/^gd_(feitos|exame)_/.test(k)) dados.dias[k] = JSON.parse(localStorage.getItem(k));
    }
  } catch(e){}
  const a = el("a", {href:URL.createObjectURL(new Blob([JSON.stringify(dados,null,2)],{type:"application/json"})), download:"guia-meu-dia-"+chave+".json"});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function importar(arq){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.tarefas)) throw 0;
      if (!confirm("Importar substituirá o cronograma e os registros atuais. Continuar?")) return;
      tarefas = d.tarefas.map(t=>({id:String(t.id||novoId()), hora:String(t.hora||"00:00"), titulo:String(t.titulo||""), dur:String(t.dur||""), intencao:String(t.intencao||"")}));
      Object.entries(d.dias||{}).forEach(([k,v])=>{ if(/^gd_(feitos|exame)_\d{4}-\d{2}-\d{2}$/.test(k)) gravar(k,v); });
      if (d.plano && PLANOS[d.plano.plano]) { plano = {plano:d.plano.plano, prog:d.plano.prog||{}, feitoEm:d.plano.feitoEm||{}}; salvaPlano(); }
      gravar("gd_tarefas_v1", tarefas); carregaDia(); render(); mostra("Dados importados.");
    } catch(e){ mostra("Arquivo inválido."); }
  };
  r.readAsText(arq);
}

$("e1").oninput = $("e2").oninput = $("e3").oninput = salvaExame;
$("btnNotif").onclick = ativarNotif;
$("btnBloco").onclick = () => { const f=$("formAdd"); f.style.display = f.style.display==="block" ? "none" : "block"; };
$("btnAdd").onclick = addBloco;
$("btnEditar").onclick = () => { editMode=!editMode; $("btnEditar").textContent = editMode ? "✔ Concluir" : "✏️ Editar"; render(); };
$("btnNovoDia").onclick = zerarDia;
$("btnExportar").onclick = exportar;
$("btnImportar").onclick = () => $("arqImportar").click();
$("arqImportar").onchange = e => { if (e.target.files[0]) importar(e.target.files[0]); e.target.value=""; };
document.addEventListener("visibilitychange", () => { if (!document.hidden) verificaAlertas(); });

carregaDia();
render();
renderPlano();
atualizaStatusNotif();
setInterval(verificaAlertas, 15000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
